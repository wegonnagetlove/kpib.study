name: Почта группы → сайт и Telegram

on:
  schedule:
    - cron: "*/30 4-20 * * *"   # каждые полчаса с 07:00 до 23:30 МСК
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Забрать новые письма
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_SEND_ATTACHMENTS: ${{ vars.TG_SEND_ATTACHMENTS }}
          MAIL_PUBLISH_SNIPPET: ${{ vars.MAIL_PUBLISH_SNIPPET }}
        run: python3 scripts/mail_sync.py
      - name: Сохранить ленту писем
        run: |
          if ! git diff --quiet data/mail.json; then
            git config user.name "kpib-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/mail.json
            git commit -m "Почта: новые письма"
            git push
          fi
