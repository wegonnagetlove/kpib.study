name: Расписание ВШГА → сайт

on:
  schedule:
    - cron: "23 */3 * * *"   # каждые 3 часа
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tt-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4
      - name: Забрать расписание с tt.audit.msu.ru
        timeout-minutes: 15
        run: python3 scripts/tt_sync.py
      - name: Сохранить
        run: |
          git add data/tt.json
          if ! git diff --cached --quiet; then
            git config user.name "kpib-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Расписание с tt.audit.msu.ru"
            git pull --rebase -q origin main
            git push
          fi
