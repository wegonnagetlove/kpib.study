name: Почта и канал «Компы Важное» → сайт

on:
  schedule:
    - cron: "*/30 * * * *"   # каждые полчаса (Telegram хранит обновления для бота 24 часа)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Забрать новые письма
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_SEND_ATTACHMENTS: ${{ vars.TG_SEND_ATTACHMENTS }}
          MAIL_PUBLISH_SNIPPET: ${{ vars.MAIL_PUBLISH_SNIPPET }}
        run: python3 scripts/mail_sync.py
      - name: Забрать посты Telegram-канала
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ vars.TG_CHANNEL_ID }}
          TG_FILTER_TAG: ${{ vars.TG_FILTER_TAG }}
          TG_SAVE_PHOTOS: ${{ vars.TG_SAVE_PHOTOS }}
        run: python3 scripts/tg_sync.py
      - name: Сохранить ленту
        run: |
          git add -A data/mail.json data/telegram.json assets/uploads/tg 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "kpib-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Лента: почта и Telegram"
            git pull --rebase -q origin main
            git push
          fi
