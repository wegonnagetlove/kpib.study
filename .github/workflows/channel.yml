name: Канал «Компы Важное» → сайт

# Автозапуск выключен: в репозитории не задан TG_BOT_TOKEN, и каждый запуск ничего не делал.
# Чтобы включить: задать секрет TG_BOT_TOKEN, сделать бота админом канала и вернуть строки
#   schedule:
#     - cron: "*/30 * * * *"
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tg-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Забрать посты Telegram-канала
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ vars.TG_CHANNEL_ID }}
          TG_FILTER_TAG: ${{ vars.TG_FILTER_TAG }}
          TG_SAVE_PHOTOS: ${{ vars.TG_SAVE_PHOTOS }}
        run: python3 scripts/tg_sync.py
      - name: Сохранить ленту
        run: |
          git add -A data/telegram.json assets/uploads/tg 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "kpib-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Лента: Telegram"
            git pull --rebase -q origin main
            git push
          fi
