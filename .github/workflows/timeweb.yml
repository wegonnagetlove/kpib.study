name: Деплой на Timeweb

# Timeweb App Platform подключён к репозиторию по ссылке, а для таких приложений
# автодеплой у Timeweb недоступен. Поэтому деплой запускаем сами через API Timeweb:
# после каждого изменения в main, в том числе коммитов ботов (Craft, расписание, канал).
# Нужен секрет TIMEWEB_TOKEN (API-токен Timeweb Cloud) и переменная TIMEWEB_APP_ID.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Craft → сайт", "Расписание ВШГА → сайт", "Канал «Компы Важное» → сайт", "Баллы БРС → сайт", "Уведомления и календарь", "Сводка: пары и дедлайны"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: timeweb-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Последний коммит main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Уже задеплоен?
        id: done
        uses: actions/cache/restore@v4
        with:
          path: .deployed
          key: timeweb-${{ steps.head.outputs.sha }}
          lookup-only: true
      - name: Запустить деплой
        if: steps.done.outputs.cache-hit != 'true'
        env:
          TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
          APP_ID: ${{ vars.TIMEWEB_APP_ID }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::нет секрета TIMEWEB_TOKEN, деплой пропущен"; exit 0; fi
          if [ -z "$APP_ID" ]; then echo "::error::укажите переменную TIMEWEB_APP_ID (ID приложения, не ID проекта)"; exit 1; fi
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "https://api.timeweb.cloud/api/v1/apps/$APP_ID/deploy" \
            -d "{\"commit_sha\":\"$SHA\"}")
          echo "HTTP $code"; head -c 600 resp.json; echo
          case "$code" in 2*) mkdir -p .deployed && echo "$SHA" > .deployed/sha ;; *) exit 1 ;; esac
      - name: Запомнить
        if: steps.done.outputs.cache-hit != 'true' && hashFiles('.deployed/sha') != ''
        uses: actions/cache/save@v4
        with:
          path: .deployed
          key: timeweb-${{ steps.head.outputs.sha }}
